name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[app,hdf5,dev]"
      - name: Lint
        run: ruff check owlfluids tests
      - name: Property tables cache
        uses: actions/cache@v4
        with:
          path: ~/.owlfluids/tables
          key: tables-${{ runner.os }}-${{ hashFiles('owlfluids/fluids/tables.py') }}
      - name: Build property tables
        run: owlfluids tables
      - name: Diagnose solver counts (temporary)
        if: runner.os == 'Linux'
        run: |
          lscpu | grep -E "Model name|Flags" | cut -c1-400
          ldd --version | head -1
          python -m numba -s | grep -iE "CPU Name|CPU Features|LLVM|SVML|Threading" | head
          python .github/diag_counts.py
          NUMBA_CPU_NAME=generic NUMBA_CACHE_DIR=/tmp/nc-generic python .github/diag_counts.py
          NUMBA_CPU_NAME=generic NUMBA_DISABLE_INTEL_SVML=1 NUMBA_CACHE_DIR=/tmp/nc-nosvml python .github/diag_counts.py
      - name: Tests
        run: python -m pytest -q
      - name: Benchmark (81 components)
        run: owlfluids bench
