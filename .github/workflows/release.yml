name: Release

# Every merge to main publishes an installer. __version__ in owlfluids/__init__.py is the
# major.minor line: the first merge after a bump releases it as is (v0.2.0), each later
# merge takes the next patch (v0.2.1, v0.2.2, ...; packaging/release_version.py). Bump
# __version__ only to start a new line. Changes to Markdown or tests alone don't release.
# The installed app finds the new GitHub release and offers to update.
#
# Also published: Actions > Release > Run workflow with "publish" ticked, a pushed tag
# matching __version__, or a GitHub release drafted with a new tag (the installer is
# added to it). Run it by hand without "publish" to build an installer without releasing
# it, for example for an older Synnax Core: that installer is attached to the run as an
# artifact, so installed copies won't update to it.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "tests/**"]
  pull_request:  # check that installer changes still build; nothing is published
    paths: ["packaging/**", ".github/workflows/release.yml", "owlfluids/update.py"]
  workflow_dispatch:
    inputs:
      synnax_version:
        description: "Synnax client to bundle, e.g. 0.59.* (leave empty for the newest)"
        required: false
        default: ""
      publish:
        description: "Publish the build as the next release (tags this commit)"
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time, in merge order, so each takes the next free version
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, to pick the next version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = python packaging/release_version.py --base
            if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $v" }
          } else {
            # the build's copy of owlfluids/__init__.py gets the release number; nothing is committed
            $v = python packaging/release_version.py --apply
          }
          if ($LASTEXITCODE) { throw "could not work out the version" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Synnax client override
        if: inputs.synnax_version != ''
        shell: pwsh
        env:
          SYNNAX_VERSION: ${{ inputs.synnax_version }}
        run: |
          if ($env:SYNNAX_VERSION -notmatch '^[0-9][0-9.*]*$') { throw "synnax_version must look like 0.59.* or 0.59.2" }
          "synnax==$env:SYNNAX_VERSION" >> packaging\constraints.txt
          $tag = "synnax" + ($env:SYNNAX_VERSION -replace '[^0-9.]', '').TrimEnd('.')
          "OWLFLUIDS_VERSION_SUFFIX=$tag" >> $env:GITHUB_ENV
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: packaging\build.ps1
      - name: Smoke test the frozen build
        shell: pwsh
        run: |
          dist\OwlFluids\owlfluids.exe --version
          dist\OwlFluids\owlfluids.exe run lox-feed --duration 2 --rate 0 --print-every 1
          if ($LASTEXITCODE) { throw "frozen run failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: OwlFluids-installer
          path: dist/OwlFluids-Setup-*.exe

  publish:
    # the only job that can write to the repository: merges to main, tags, or a manual run with
    # "publish" (a build pinned to an older Synnax client is never published, so updates stay on the newest)
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (inputs.publish && inputs.synnax_version == '')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OwlFluids-installer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.installer.outputs.version) }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a release drafted on GitHub for this tag: add the installer to it
            gh release upload "$TAG" dist/OwlFluids-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$GITHUB_REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG was published while this ran; run the workflow again" && exit 1
          else
            gh release create "$TAG" dist/OwlFluids-Setup-*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OwlFluids $TAG" --generate-notes
          fi
