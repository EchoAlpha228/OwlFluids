name: Release

# To publish an installer, bump __version__ in owlfluids/__init__.py, merge, then either
#   - Actions > Release > Run workflow with "publish" ticked (tags main as v<__version__>), or
#   - git tag v0.2.0 && git push origin v0.2.0, or
#   - draft a GitHub release with a new tag v0.2.0 (the installer is added to it).
# The installed app finds the new GitHub release and offers to update.
#
# Run it by hand without "publish" to build an installer without releasing it, for
# example for an older Synnax Core. That installer is attached to the run as an
# artifact, so installed copies won't update to it.

on:
  push:
    tags: ["v*"]
  pull_request:  # check that installer changes still build; nothing is published
    paths: ["packaging/**", ".github/workflows/release.yml", "owlfluids/update.py"]
  workflow_dispatch:
    inputs:
      synnax_version:
        description: "Synnax client to bundle, e.g. 0.59.* (leave empty for the newest)"
        required: false
        default: ""
      publish:
        description: "Publish the build as release v<__version__> (tags this commit)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import ast,pathlib; t=pathlib.Path('owlfluids/__init__.py').read_text(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'][0])"
          if ("${{ github.ref_type }}" -eq "tag" -and "v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match __version__ $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Synnax client override
        if: inputs.synnax_version != ''
        shell: pwsh
        env:
          SYNNAX_VERSION: ${{ inputs.synnax_version }}
        run: |
          if ($env:SYNNAX_VERSION -notmatch '^[0-9][0-9.*]*$') { throw "synnax_version must look like 0.59.* or 0.59.2" }
          "synnax==$env:SYNNAX_VERSION" >> packaging\constraints.txt
          $tag = "synnax" + ($env:SYNNAX_VERSION -replace '[^0-9.]', '').TrimEnd('.')
          "OWLFLUIDS_VERSION_SUFFIX=$tag" >> $env:GITHUB_ENV
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: packaging\build.ps1
      - name: Smoke test the frozen build
        shell: pwsh
        run: |
          dist\OwlFluids\owlfluids.exe --version
          dist\OwlFluids\owlfluids.exe run lox-feed --duration 2 --rate 0 --print-every 1
          if ($LASTEXITCODE) { throw "frozen run failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: OwlFluids-installer
          path: dist/OwlFluids-Setup-*.exe

  publish:
    # the only job that can write to the repository: tags, or a manual run with "publish"
    # (a release built against a pinned Synnax client is never published, so updates stay on the newest)
    if: github.ref_type == 'tag' || (inputs.publish && inputs.synnax_version == '')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OwlFluids-installer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.installer.outputs.version) }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a release drafted on GitHub for this tag: add the installer to it
            gh release upload "$TAG" dist/OwlFluids-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$GITHUB_REF_TYPE" != tag ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG already exists; bump __version__ before publishing" && exit 1
          else
            gh release create "$TAG" dist/OwlFluids-Setup-*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OwlFluids $TAG" --generate-notes
          fi
