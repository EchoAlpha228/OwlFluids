# Hardware-in-the-loop settings for `owlfluids run ... --synnax examples/synnax.yaml`
# (or Run > Connect to Synnax… in the app). Channels that don't exist are created.
synnax:
  host: localhost
  port: 9090
  username: synnax
  password: seldon
  secure: false
  rate: 100                 # Hz written to Synnax
  index: owl_time
  create_channels: true
  # Leave these out to use defaults: every sensor -> its id in lower case
  # (PT-TK -> pt_tk), every valve -> <valve>_cmd (read) and <valve>_state (written).
  sensors:
    PT-TK: pt_tk
    PT-INJ: pt_inj
    TC-INJ: tc_inj
    FM-LOX: fm_lox
  valves:
    V-P: {read: press_cmd, write: press_state}
    V-M: {read: mpv_cmd, write: mpv_state}
