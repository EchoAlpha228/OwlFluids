name: GN2 bottle blowdown
components:
- {id: K1, type: tank, fluid: nitrogen, volume: 49 L, pressure: 2400 psi, temperature: 20 C, at: [0, 0]}
- {id: V1, type: valve, cv: 0.3, open_time: 50 ms, at: [150, 0]}
- {id: ATM, type: boundary, fluid: nitrogen, at: [300, 0]}
connections:
- [K1.top, V1.in]
- [V1.out, ATM.port]
sensors:
- {id: PT-K1, type: pressure, line: [K1.top, V1.in], units: psi}
- {id: TC-K1, type: temperature, line: [K1.top, V1.in], units: F}
- {id: FM-V1, type: mass_flow, line: [V1.out, ATM.port], units: kg/s}
