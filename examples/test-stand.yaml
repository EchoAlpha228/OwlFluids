- {id: PT-OX, type: pressure, line: [TEE-OXU.b, TK-OX.top], units: psi}
- {id: PT-FU, type: pressure, line: [TEE-FUU.b, TK-FU.top], units: psi}
- {id: PT-OXI, type: pressure, line: [F-OXF2.out, INJ-OX.in], along: 1.0, units: psi}
- {id: PT-FUI, type: pressure, line: [F-FUF2.out, INJ-FU.in], along: 1.0, units: psi}
- {id: TC-OX, type: temperature, line: [TK-OX.bottom, F-OXF1.in]}
- {id: FM-OX, type: mass_flow, line: [V-OXM.out, F-OXF2.in]}
- {id: FM-FU, type: mass_flow, line: [V-FUM.out, F-FUF2.in]}
