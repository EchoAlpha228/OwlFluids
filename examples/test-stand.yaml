- [TEE-FUD.b, V-FUD.in, {length: 0.3 m}]
- [V-FUD.out, DUMP-FU.port, {length: 0}]
- [INJ-OX.out, CH-OX.a, {length: 0}]
- [CH-OX.b, NOZ-OX.in, {length: 0}]
- [NOZ-OX.out, ATM-COX.port, {length: 0}]
