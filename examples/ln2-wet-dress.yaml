name: LN2 wet dress
components:
- {id: K-N2, type: tank, fluid: nitrogen, volume: 49 L, pressure: 3000 psi, temperature: 20 C, at: [0, -220]}
- {id: REG, type: regulator, cv: 0.3, setpoint: 250 psi, droop: 20 psi, at: [150, -220]}
- {id: V-P, type: valve, cv: 0.3, at: [300, -220]}
- {id: TK, type: tank, fluid: nitrogen, pressurant: nitrogen, volume: 100 L, fill: 0.85, pressure: 40 psi, temperature: 78 K, diameter: 0.4 m, at: [0, 0]}
- {id: V-V, type: valve, cv: 0.3, at: [150, -80]}
- {id: ATM-V, type: boundary, fluid: nitrogen, at: [300, -40]}
- {id: V-M, type: valve, cv: 4, open_time: 200 ms, at: [150, 160]}
- {id: L-F, type: volume, volume: 0.33 L, wall_mass: 1.4 kg, film_coefficient: 2000, at: [300, 160]}
- {id: TEE, type: tee, at: [450, 160]}
- {id: V-B, type: valve, cv: 0.2, at: [450, 260]}
- {id: ATM-B, type: boundary, fluid: nitrogen, at: [600, 260]}
- {id: INJ, type: orifice, cda: 25 mm2, at: [600, 160]}
- {id: ATM, type: boundary, fluid: nitrogen, at: [750, 160]}
connections:
- [K-N2.top, REG.in, {length: 0.3}]
- [REG.out, V-P.in, {length: 0.5}]
- [V-P.out, TK.top, {length: 1}]
- [TK.top, V-V.in, {length: 0.3}]
- [V-V.out, ATM-V.port, {length: 0}]
- [TK.bottom, V-M.in, {length: 0.5}]
- [V-M.out, L-F.a, {length: 0}]
- [L-F.b, TEE.a, {length: 0}]
- [TEE.b, INJ.in, {length: 0.3}]
- [INJ.out, ATM.port, {length: 0}]
- [TEE.d, V-B.in, {length: 0.3}]
- [V-B.out, ATM-B.port, {length: 0}]
sensors:
- {id: PT-TK, type: pressure, line: [V-P.out, TK.top], units: psi}
- {id: PT-INJ, type: pressure, line: [TEE.b, INJ.in], along: 1.0, units: psi}
- {id: TC-INJ, type: temperature, line: [TEE.b, INJ.in], along: 1.0, units: F}
- {id: TC-LINE, type: wall_temperature, at: L-F, units: F}
- {id: FM-LN2, type: mass_flow, line: [V-M.out, L-F.a], units: kg/s}
- {id: M-LN2, type: mass, at: TK, units: kg}
- {id: LL-LN2, type: level, at: TK, units: '%'}
