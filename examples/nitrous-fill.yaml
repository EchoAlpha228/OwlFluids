name: Nitrous fill with air purge
settings: {junction_volume: 20 cc}
components:
- {id: NOS, type: tank, fluid: nitrous, volume: 30 L, fill: 0.8, temperature: 20 C, wall_mass: 15 kg, wall_material: aluminum, at: [0, 260]}
- {id: OFTV, type: valve, cv: 1.5, open_time: 1 s, at: [0, 150]}
- {id: 'OFF', type: orifice, cv: 2.0, at: [60, 0]}
- {id: OFRV-1, type: relief_valve, cv: 0.3, set_pressure: 1000 psi, at: [370, -80]}
- {id: ATM-1, type: boundary, fluid: nitrous, at: [370, -160]}
- {id: OFV, type: valve, cv: 1.2, open_time: 300 ms, at: [420, 0]}
- {id: OFCV, type: check_valve, cv: 1.2, at: [540, 0]}
- {id: ODV, type: valve, cv: 0.5, open_time: 200 ms, normally: closed, at: [560, -80]}
- {id: ATM-2, type: boundary, fluid: nitrous, at: [560, -160]}
- {id: OFRV-2, type: relief_valve, cv: 0.3, set_pressure: 1000 psi, at: [650, -80]}
- {id: ATM-3, type: boundary, fluid: nitrous, at: [650, -160]}
- {id: OFIF, type: orifice, cv: 2.0, at: [660, 0]}
- {id: OQD, type: fitting, kind: quick_disconnect, diameter: 0.43 in, at: [880, 0]}
- {id: RFCV, type: check_valve, cv: 1.2, at: [960, 0]}
- {id: RT, type: tank, fluid: nitrous, volume: 15 L, pressure: 1 atm, temperature: 20 C, wall_mass: 6 kg, wall_material: aluminum, at: [1040, 100]}
- {id: RTV, type: valve, cv: 0.15, open_time: 200 ms, at: [1040, -80]}
- {id: ATM-4, type: boundary, fluid: nitrous, at: [1040, -160]}
- {id: AC, type: air_pump, flow: 3 g/s, start_pressure: 100 psig, stop_pressure: 115 psig, at: [200, 340]}
- {id: AR, type: tank, fluid: air, volume: 20 L, pressure: 115 psig, temperature: 20 C, at: [280, 340]}
- {id: APRV, type: relief_valve, cv: 0.1, set_pressure: 150 psi, at: [280, 250]}
- {id: ATM-A, type: boundary, fluid: air, at: [280, 180]}
- {id: APR, type: regulator, cv: 0.3, setpoint: 90 psig, droop: 10 psi, at: [350, 340]}
- {id: AIV, type: valve, cv: 0.5, normally: open, at: [400, 340]}
- {id: ACF, type: orifice, cv: 0.8, at: [450, 340]}
- {id: OPGS, type: valve, cv: 0.3, open_time: 50 ms, at: [470, 180]}
- {id: OPGCV, type: check_valve, cv: 0.3, at: [470, 90]}
connections:
- [NOS.bottom, OFTV.in, {length: 0.3}]
- [OFTV.out, OFF.in, {length: 0.5}]
- [OFF.out, OFV.in, {length: 1}]
- [OFF.out, OFRV-1.in, {length: 0.1}]
- [OFRV-1.out, ATM-1.port, {length: 0}]
- [OFV.out, OFCV.in, {length: 0.2}]
- [OFCV.out, OFIF.in, {length: 0.5}]
- [OFCV.out, ODV.in, {length: 0.3}]
- [ODV.out, ATM-2.port, {length: 0}]
- [OFCV.out, OFRV-2.in, {length: 0.1}]
- [OFRV-2.out, ATM-3.port, {length: 0}]
- [OFIF.out, OQD.in, {length: 3}]
- [OQD.out, RFCV.in, {length: 0.3}]
- [RFCV.out, RT.bottom, {length: 0.5}]
- [RT.top, RTV.in, {length: 0.3}]
- [RTV.out, ATM-4.port, {length: 0}]
- [AC.out, AR.top, {length: 0.5}]
- [AR.top, APRV.in, {length: 0.1}]
- [APRV.out, ATM-A.port, {length: 0}]
- [AR.top, APR.in, {length: 0.5}]
- [APR.out, AIV.in, {length: 0.3}]
- [AIV.out, ACF.in, {length: 0.3}]
- [ACF.out, OPGS.in, {length: 1}]
- [OPGS.out, OPGCV.in, {length: 0.1}]
- [OPGCV.out, OFV.out, {length: 0.3}]
sensors:
- {id: OFPT, type: pressure, line: [OFF.out, OFV.in], units: psig}
- {id: OFT, type: temperature, line: [OFF.out, OFV.in], units: F}
- {id: OIPT, type: pressure, line: [OFIF.out, OQD.in], units: psig}
- {id: APT, type: pressure, line: [ACF.out, OPGS.in], units: psig}
- {id: ART, type: pressure, line: [AC.out, AR.top], units: psig}
- {id: FM-OF, type: mass_flow, line: [OFF.out, OFV.in], units: kg/s}
- {id: M-RT, type: mass, at: RT, units: kg}
- {id: LL-RT, type: level, at: RT, units: '%'}
- {id: PF-OF, type: purge_fraction, line: [OFV.out, OFCV.in], units: '%'}
- {id: AC-ON, type: valve_position, at: AC}
